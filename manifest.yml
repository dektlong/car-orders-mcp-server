---
applications:
  - name: car-orders-mcp
    memory: 1G
    instances: 1
    path: target/car-orders-mcp-0.0.1-SNAPSHOT.jar
    buildpacks:
      - java_buildpack_offline
    routes:
      - route: car-orders.apps.internal  
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 21.+ } }'
    services:
      - dekt-mcp-gw
